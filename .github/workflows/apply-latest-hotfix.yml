name: Apply latest HandWriter hotfix

on:
  push:
    paths:
      - '.github/workflows/apply-latest-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hotfix
        run: python scripts/apply_latest_hotfix.py
      - name: Validate JavaScript
        run: node --check src/mvp-ui.js
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: blend noise into glyphs and rotate textboxes"
            git push origin HEAD:main
          fi
